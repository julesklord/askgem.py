[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mentask"
version = "0.32.0"
description = "MentAsk: Universal AI Coding Agent with multi-provider support via models.dev"
readme = "README.md"
authors = [
    { name = "julesklord", email = "julioglez.93@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.0.0,<3.0.0",
    "rich>=14.0.0,<15.0.0",
    "keyring>=25.0.0",
    "pydantic>=2.0.0",
    "prompt-toolkit>=3.0.0",
    "mcp>=1.0.0,<2.0.0",
    "keyrings.alt",
    "aiofiles>=25.1.0",
    "pyyaml>=6.0.0",
    "toml>=0.10.2",
    "requests>=2.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.0.0",
    "ruff>=0.4.0",
    "build",
    "twine",
    "tox>=4.0.0",
    "mypy>=1.0.0",
    "bandit>=1.7",
    "pip-audit",
    "types-aiofiles",
    "types-requests",
    "types-toml",
    "types-pyyaml",
]

security = [
    "pip-audit",
    "bandit>=1.7",
]

[project.scripts]
mentask = "mentask.cli.main:run_chatbot"
mentask-mcp = "mentask.cli.mcp_server:main"

[project.urls]
Homepage = "https://github.com/julesklord/mentask.py"
Documentation = "https://github.com/julesklord/mentask.py/wiki"
Changelog = "https://github.com/julesklord/mentask.py/blob/main/CHANGELOG.md"

[tool.setuptools.package-data]
mentask = ["locales/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D"]
ignore = [
    "E501",
    # Missing docstrings (D1xx)
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    # Stylistic/formatting choices where Google Style or existing code diverges
    "D203", "D205", "D212", "D213", "D400", "D401", "D415",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = [
    "--tb=short",
    "-m", "not integration",
]
markers = [
    "integration: tests that require external services (Ollama, network, etc.)",
    "slow: tests that take more than 5 seconds",
]

[tool.coverage.run]
source = ["src/mentask"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/.venv/*",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    '^\s*\.\.\.$',
]

[tool.coverage.html]
directory = "htmlcov"

[dependency-groups]
dev = [
    "ruff>=0.15.18",
]
